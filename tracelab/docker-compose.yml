services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracelab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: tracelab
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelab -d tracelab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    image: tracelab-backend
    restart: unless-stopped
    environment: &app-env
      TRACELAB_DATABASE_URL: postgresql+psycopg://tracelab:${POSTGRES_PASSWORD:-change-me}@db:5432/tracelab
      TRACELAB_API_KEY: ${TRACELAB_API_KEY:-}
      TRACELAB_ALLOW_PRIVATE_TARGETS: ${TRACELAB_ALLOW_PRIVATE_TARGETS:-false}
      TRACELAB_LOG_LEVEL: ${TRACELAB_LOG_LEVEL:-INFO}
      TRACELAB_WORKER_CONCURRENCY: ${TRACELAB_WORKER_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # direct API + Swagger UI at /docs (local only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: tracelab-backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
